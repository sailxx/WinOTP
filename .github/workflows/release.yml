name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.versions.outputs.linux }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: versions
        shell: pwsh
        run: |
          $windows = [xml](Get-Content src/WinOTP/WinOTP.csproj -Raw)
          $linux = [xml](Get-Content src/WinOTP.Linux/WinOTP.Linux.csproj -Raw)
          $installer = Select-String -Path installer/WinOTP.iss -Pattern '^#define AppVersion "([^"]+)"$'
          if ($env:GITHUB_REF_NAME -ne "v$($windows.Project.PropertyGroup.Version)" -or
              $env:GITHUB_REF_NAME -ne "v$($installer.Matches.Groups[1].Value)") {
            throw 'Tag must match the Windows project and installer versions.'
          }
          $includeLinux = $env:GITHUB_REF_NAME -eq "v$($linux.Project.PropertyGroup.Version)"
          "linux=$($includeLinux.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  linux:
    needs: scope
    if: needs.scope.outputs.linux == 'true'
    uses: ./.github/workflows/linux.yml
  release:
    needs: [scope, linux]
    if: ${{ !cancelled() && needs.scope.result == 'success' && (needs.linux.result == 'success' || needs.linux.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/OtpVectors/OtpVectors.csproj -c Release
      - run: msbuild src/WinOTP/WinOTP.csproj /restore /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true /p:PublishDir=artifacts/publish/ /verbosity:minimal
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $xaml = @(Get-ChildItem src/WinOTP/bin/Release -Filter *.xbf -File -Recurse)
          if ($xaml.Count -eq 0) { throw 'No compiled WinUI XAML resources were produced.' }
          Copy-Item -Path $xaml.FullName -Destination src/WinOTP/artifacts/publish/ -Force
          if (-not (Test-Path src/WinOTP/artifacts/publish/WinOTP.exe)) { throw 'Missing WinOTP executable.' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not installed.' }
          & $compiler installer/WinOTP.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/WinOTP-Setup.exe
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.linux == 'true'
        with:
          name: linux-packages
          path: artifacts/linux-release
      - name: Select release files
        id: assets
        shell: pwsh
        env:
          INCLUDE_LINUX: ${{ needs.scope.outputs.linux }}
        run: |
          $files = @('artifacts/WinOTP-Setup.exe')
          if ($env:INCLUDE_LINUX -eq 'true') {
            $files += @(
              'artifacts/linux-release/*.deb'
              'artifacts/linux-release/*.rpm'
              'artifacts/linux-release/*.AppImage'
              'artifacts/linux-release/linux-native.png'
            )
          }
          @('files<<EOF') + $files + @('EOF') >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: true
          draft: true
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.files }}
